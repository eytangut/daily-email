# ---- Daily email settings --------------------------------------------------
timezone: Asia/Jerusalem     # which "today" the plugins see
language: he
direction: rtl               # rtl | ltr

# Text templates. Available fields:
#   {heb_date} {heb_day} {heb_month} {heb_year}   Hebrew date, e.g. י״ח בחשון תשפ״ז
#   {weekday} {greg_date} {iso}                    e.g. חמישי / 29 באוקטובר 2026 / 2026-10-29
subject: "תנ״ך להיום · {heb_day} ב{heb_month}"
header:
  title: "{heb_date}"
  subtitle: "יום {weekday} · {greg_date}"

# ---- Plugins: one or more cards per entry, in this order -------------------
# "type" selects the plugin (plugins/<name>.py); all other keys go to it as options.
# The same type may appear several times with different options.
plugins:
  - type: tanakh
    title: תנ״ך
    color: brown             # brown | blue | green | plum
    # Days are balanced by verse count x these multipliers (1.0 = normal; below 1 = easier,
    # so more fits in a day; above 1 = harder). Keys are Sefaria book names; omitted books
    # count as 1.0. Edit freely -- the whole month reshuffles to match.
    difficulty:
      Genesis: 0.8
      Exodus: 0.8
      Leviticus: 0.8
      Numbers: 0.8
      Deuteronomy: 0.8
      Joshua: 0.8
      Judges: 0.8
      I_Samuel: 0.8
      II_Samuel: 0.8
      I_Kings: 0.8
      II_Kings: 0.8
      Daniel: 2
    # How far (as a fraction of one day's reading, below 0.5) a day may stretch or shrink
    # to end exactly at the end of a book.
    tolerance: 0.25
