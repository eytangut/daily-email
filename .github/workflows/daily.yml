name: Daily email

on:
  schedule:
    # UTC. Deliberately early and off the top of the hour: GitHub delays scheduled runs
    # by minutes to hours at busy times (esp. :00), so 01:23 UTC (03:23/04:23 Israel)
    # leaves a buffer and the mail still lands before morning.
    - cron: "23 1 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
