name: Monthly calendar image

# Manual only: Actions -> "Monthly calendar image" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Any date (YYYY-MM-DD) in the Hebrew month you want; empty = today"
        required: false
        default: ""

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python run.py --board "$DAY"
        env:
          DAY: ${{ inputs.date }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
